    title: Flight Management System (FMS) Database Subscription Services
    description: "1.\tAdvance Contract Award Notice (ACAN)\r\nAn ACAN is a public notice indicating\
      \ to the supplier community that a department or agency intends to award a contract\
      \ for services to a pre-identified supplier, thereby allowing other suppliers to signal\
      \ their interest in bidding, by submitting a statement of capabilities. If no supplier\
      \ submits a statement of capabilities that meets the requirements set out in the ACAN,\
      \ on or before the closing date stated in the ACAN, the contracting officer may then\
      \ proceed with the award to the pre-identified supplier.\r\n2.\tDefinition of the requirement\r\
      \nThe Department of Transport Canada, through the Aircraft Services Directorate (ASD)\
      \ (the “End User”) has a requirement for electronic Flight Management System (FMS) database\
      \ services on an as and when required basis.\r\nThe requirement involves uninterrupted\
      \ access to the supplier’s FMS database items.\r\n3.\tCriteria for assessment of the\
      \ Statement of Capabilities (Minimum Essential Requirements)\r\nThe End User must operate\
      \ in accordance with the latest navigation information provided by the supplier. The\
      \ supplier must be the production certificate holder, as well as its current parts and\
      \ support products manufacturer for the FMS in use on the End User’s fleet and flight\
      \ simulator.\r\n4.\tApplicability of the trade agreement(s) to the procurement\r\nThis\
      \ procurement is subject to the following trade agreements:\r\no\tCanadian Free Trade\
      \ Agreement (CFTA)\r\no\tRevised World Trade Organization - Agreement on Government\
      \ Procurement (WTO-AGP)\r\no\tCanada-European Union Comprehensive Economic and Trade\
      \ Agreement (CETA)\r\no\tComprehensive and Progressive Agreement for Trans-Pacific Partnership\
      \ (CPTPP)\r\no\tCanada-Chile Free Trade Agreement (CCFTA)\r\no\tCanada-Colombia Free\
      \ Trade Agreement\r\no\tCanada-Honduras Free Trade Agreement\r\no\tCanada-Korea Free\
      \ Trade Agreement\r\no\tCanada-Panama Free Trade Agreement\r\no\tCanada-Peru Free Trade\
      \ Agreement (CPFTA)\r\no\tCanada-United Kingdom Trade Continuity Agreement (Canada-UK\
      \ TCA)\r\no\tCanada-Ukraine Free Trade Agreement (CUFTA)\r\n5.\tJustification for the\
      \ Pre-Identified Supplier\r\nThe End User must operate in accordance with the latest\
      \ navigation information provided by the pre-identified manufacturer. The pre-identified\
      \ supplier is the production certificate holder, as well as the current parts and support\
      \ products manufacturer for the FMS in use on the End User’s fleet and flight simulator.\r\
      \n6.\tGovernment Contracts Regulations Exception(s)\r\nThis ACAN invokes the exception\
      \ to the Government Contracts Regulations found in Part I section 6 (d).\r\n7.\tExclusions\
      \ and/or Limited Tendering Reasons\r\nThe following exclusions and/or limited tendering\
      \ reasons are invoked:\r\n•\tunder the CFTA, CAP Code 71 Exclusive Rights (a. ii.)\r\
      \n•\tunder all of Canada’s trade agreements, CAP Code 74 Interchangeable Parts\r\n8.\t\
      Ownership of Intellectual Property\r\nOwnership of any Foreground Intellectual Property\
      \ arising out of the proposed contract will vest in the Contractor.\r\n9.\tPeriod of\
      \ the proposed contract or delivery date\r\nThe proposed contract is for a period of\
      \ three (3) years, starting 2023-09-07. Two (2) one-year optional periods are considered\
      \ to extend the contract period.\r\n10.\tCost estimate of the proposed contract\r\n\
      The estimated value of the contract, including options, is USD $ 360,000.00 (HST extra).\r\
      \n11.\tName and address of the pre-identified supplier\r\nUniversal Avionics \r\n3260\
      \ E. Universal Way\r\nTucson (AZ) 85756\r\nUSA\r\n12.\tSuppliers' right to submit a\
      \ statement of capabilities\r\nSuppliers who consider themselves fully qualified and\
      \ available to provide the services described in the ACAN may submit a statement of\
      \ capabilities in writing to the contact person identified in this notice on or before\
      \ the closing date of this notice. The statement of capabilities must clearly demonstrate\
      \ how the supplier meets the advertised requirements.\r\n13.\tClosing date for a submission\
      \ of a statement of capabilities\r\n2023-07-06 at 2PM (ET)\r\n14.\tInquiries and submission\
      \ of statements of capabilities\r\nInquiries and statements of capabilities are to be\
      \ directed to:\r\nName: Dominik Giroux\r\nTransport Canada\r\nAircraft Services Directorate\r\
      \nTelephone: \t+1 343-576-9931\r\nE-mail address: dominik.giroux@tc.gc.ca"
