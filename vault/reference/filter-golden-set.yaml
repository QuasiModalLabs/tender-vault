      \ with the award to the pre-identified supplier.\r\n\r\n1. Definition of the requirement:\r\
      \n\r\nThe Correctional Service of Canada (CSC) has a requirement to support Indigenous\
      \ offender reintegration through targeted interventions within the Indigenous Continuum\
