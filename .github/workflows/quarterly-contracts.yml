# Disabled 2026-08-04. This rebuilt data/contracts.db, which is no
# longer committed: it's filtered and scored against my-company.md,
# so the artifact isn't portable and shouldn't ship in the repo.
# Run scripts/contracts_ingest.py locally instead.
#
# Still dispatchable by hand. A manual run builds the DB on the runner
# and discards it, which smoke-tests contracts_ingest.py against the
# live upstream dataset without persisting anything.
on:
  workflow_dispatch:
name: Quarterly contracts refresh

# The proactive-disclosure dataset updates quarterly. This ran on the 5th of
# Jan/Apr/Jul/Oct at 07:00 UTC; that schedule is gone along with the commit
# step it fed.

concurrency:
  group: contracts
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build contracts DB and agency intel
        # Streams the large source CSV; the filtered SQLite and the agency
        # intel files stay on the runner. Nothing is committed — both are
        # profile-scored and not portable, so they are rebuilt locally.
        run: python scripts/contracts_ingest.py
