# Disabled 2026-08-04. This rebuilt data/plans.db, which is no longer
# committed: it's filtered and scored against my-company.md, so the
# artifact isn't portable and shouldn't ship in the repo.
# Run scripts/plans_ingest.py locally instead.
#
# Still dispatchable by hand. A manual run builds the DB on the runner
# and discards it, which smoke-tests plans_ingest.py against the live
# upstream dataset without persisting anything.
on:
  workflow_dispatch:
name: Departmental-plans refresh

# The GC InfoBase DP/DRR expenditures dataset (live DataStore resource) gains a
# new fiscal year roughly annually as departments publish plans, and revises
# recent years in between. This refreshed quarterly on the 12th at 07:00 UTC;
# that schedule is gone along with the commit step it fed.
#
# Unlike the contracts/tenders jobs this one runs the embedding model to score
# planning_explanation at ingest, so it installs sentence-transformers and pulls
# all-MiniLM-L6-v2 on each run (a couple of minutes).

concurrency:
  group: plans
  cancel-in-progress: false

jobs:
  plans:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build plans DB (scores planning_explanation at ingest)
        # Downloads the live DataStore dump, embeds and two-pole-scores the
        # planning/variance prose, writes data/plans.db — which stays on the
        # runner. Nothing is committed; the DB is profile-scored and not
        # portable, so it is rebuilt locally by whoever needs it.
        run: python scripts/plans_ingest.py
