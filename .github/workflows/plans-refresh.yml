name: Departmental-plans refresh

# The GC InfoBase DP/DRR expenditures dataset (live DataStore resource) gains a
# new fiscal year roughly annually as departments publish plans, and revises
# recent years in between. We refresh quarterly on the 12th at 07:00 UTC — often
# enough to catch new publication and revisions, rare enough not to churn.
#
# Unlike the contracts/tenders jobs this one runs the embedding model to score
# planning_explanation at ingest, so it installs sentence-transformers and pulls
# all-MiniLM-L6-v2 on each run (a couple of minutes). The scored SQLite is what
# gets committed, so a fresh clone has a current, prebuilt plans layer with no
# model run needed.
on:
  schedule:
    - cron: "0 7 12 1,4,7,10 *"
  workflow_dispatch:

concurrency:
  group: plans
  cancel-in-progress: false

jobs:
  plans:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build plans DB (scores planning_explanation at ingest)
        # Downloads the live DataStore dump, embeds and two-pole-scores the
        # planning/variance prose, writes data/plans.db.
        run: python scripts/plans_ingest.py

      - name: Commit DB if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plans.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "plans: quarterly refresh ${DATE}"
            git push
          fi
